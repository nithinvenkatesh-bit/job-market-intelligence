version: 2

models:
  - name: stg_postings
    description: "Benchmark postings with LinkedIn ground-truth labels, annualised."
    columns:
      - name: job_id
        tests: [unique, not_null]

      - name: gt_pay_period
        tests:
          - accepted_values:
              arguments:
                values: ['HOURLY', 'WEEKLY', 'BIWEEKLY', 'MONTHLY', 'YEARLY']
              config:
                where: "gt_pay_period is not null"

      - name: gt_seniority
        description: >
          WEAK label. LinkedIn's own tagging is inconsistent -- error
          analysis found hourly rates tagged YEARLY and entry-level roles
          tagged Mid-Senior. Treated as a reference, not as truth.
        tests:
          - accepted_values:
              arguments:
                values: ['Internship', 'Entry level', 'Associate',
                         'Mid-Senior level', 'Director', 'Executive']
              config:
                where: "gt_seniority is not null"

      - name: stratum
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['labeled_stated', 'labeled_not_stated']

  - name: stg_extractions
    description: "All extractions from all methods, unioned into one shape."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [job_id, method]
    columns:
      - name: job_id
        tests: [not_null]

      - name: method
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['rules', 'zero_shot', 'few_shot',
                         'schema_rules', 'decomposed']

      - name: cost_usd
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: fct_method_performance
    description: "Headline scorecard: one row per extraction method."
    columns:
      - name: method
        tests: [unique, not_null]

      - name: salary_within_10pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

      - name: seniority_accuracy
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

      - name: abstention_rate
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1