name: 'job_market_intelligence'
version: '1.0.0'
config-version: 2

profile: 'jmi'

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  job_market_intelligence:
    # Staging models are views: cheap, and always reflect current parquet.
    staging:
      +materialized: view
      +schema: staging
    # Marts get queried repeatedly by the dashboard, so they materialise.
    marts:
      +materialized: table
      +schema: marts
      