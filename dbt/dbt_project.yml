name: 'job_market_intelligence'
version: '1.0.0'
config-version: 2

profile: 'jmi'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  job_market_intelligence:
    # Views: cheap, and always reflect the current parquet files.
    staging:
      +materialized: view
      +schema: staging
    # Ephemeral: inlined into downstream models rather than persisted.
    # This is a join-and-compute step nothing queries directly.
    intermediate:
      +materialized: ephemeral
    # Tables: the dashboard hits these repeatedly.
    marts:
      +materialized: table
      +schema: marts